{{- $global := . -}}
{{- range $name, $cluster := $global.Values.clusters -}}
{{- if include "minicore.lib.webEnabled" (list $global $cluster) }}
  {{- $replicas := $global.Values.common.web.replicas -}}
  {{- if and (hasKey $cluster.web "replicas") (not (kindIs "invalid" $cluster.web.replicas)) -}}
    {{- $replicas = $cluster.web.replicas -}}
  {{- end }}
  {{- $mode := $cluster.web.pod_anti_affinity | default $global.Values.common.web.pod_anti_affinity -}}
  {{- $matchLabels := dict "app" (printf "%s-%s-web" $global.Release.Name $name) -}}
  {{- $valuePath := printf "clusters.%s.web.pod_anti_affinity" $name -}}
  {{- $affinity := include "minicore.lib.podAntiAffinity" (list $mode $matchLabels $replicas $valuePath) | trim }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $global.Release.Name }}-{{ $name }}-web
  annotations:
    minicore/host: web.{{ include "minicore.lib.regionName" (list $global $cluster) }}.{{ include "minicore.lib.domain" (list $global) }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: {{ $global.Release.Name }}-{{ $name }}-web
  template:
    metadata:
      labels:
        app: {{ $global.Release.Name }}-{{ $name }}-web
    spec:
      {{- if $affinity }}
      affinity:
        podAntiAffinity:
          {{- $affinity | nindent 10 }}
      {{- end }}
      containers:
        - name: web
          image: {{ $cluster.web.image | default $global.Values.common.web.image | quote }}
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $global.Release.Name }}-{{ $name }}-web
spec:
  selector:
    app: {{ $global.Release.Name }}-{{ $name }}-web
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
{{- end }}